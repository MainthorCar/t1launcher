name: Deploy T1 Puente Web

# Publica la app en GitHub Pages y copia el ÚLTIMO T1Launcher (Release) solo.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cada hora, desde main, re-copia el último APK (T1N más alto marcado como "Latest").
    # Se hace por aquí y NO por el evento "release:published" porque ese deploy sale de la
    # etiqueta de versión (refs/tags/T1Nxxx) y GitHub Pages solo publica desde la rama main,
    # por lo que esos despliegues siempre fallaban en rojo.
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Copiar el último T1Launcher (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/apks
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir /tmp/rel || true
          if ls /tmp/rel/*.apk >/dev/null 2>&1; then
            cp "$(ls -S /tmp/rel/*.apk | head -1)" web/apks/t1launcher.apk
            echo "APK copiado:"; ls -la web/apks
          else
            echo "Todavía no hay APK en Releases."
          fi

      - name: Copiar el último Aurora Jetour (Release de MainthorCar/AuroraJetour)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/apks
          rm -rf /tmp/aur && mkdir -p /tmp/aur
          gh release download --repo MainthorCar/AuroraJetour --pattern "*.apk" --dir /tmp/aur || true
          if ls /tmp/aur/*.apk >/dev/null 2>&1; then
            cp "$(ls -S /tmp/aur/*.apk | head -1)" web/apks/aurora.apk
            echo "Aurora copiado:"; ls -la web/apks
          else
            echo "Todavía no hay APK de Aurora Jetour en Releases."
          fi

      - name: Preparar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
